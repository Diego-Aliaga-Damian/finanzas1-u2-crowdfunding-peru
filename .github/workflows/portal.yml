# Publica el portal de entrega (carpeta portal/) en GitHub Pages.
# Requiere activar Pages una vez: Settings → Pages → Source: «GitHub Actions».
name: Portal de entrega

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "dashboard/descargas/**"
      - "docs/guia/**"
      - "datos_procesados/**"
      - "herramientas/portal/**"
      - ".github/workflows/portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Copia los PDF, los CSV y los pósteres al sitio (solo biblioteca estándar; las vistas previas ya están en portal/img)
      - run: python herramientas/portal/generar_portal.py --archivos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - id: despliegue
        uses: actions/deploy-pages@v4
